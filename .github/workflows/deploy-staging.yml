name: Deploy Staging

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.KAMAL_REGISTRY_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Setup SSH key
        run: |
          mkdir -p .kamal
          echo "${{ secrets.EC2_SSH_KEY }}" > .kamal/github_actions_key
          chmod 600 .kamal/github_actions_key

      - name: Generate image tag
        id: image
        run: |
          echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t lalithamangalamm/kamal_spike_run:${{ steps.image.outputs.tag }} \
            --push .

      - name: Deploy staging
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          kamal deploy -d staging \
            -P image_tag=${{ steps.image.outputs.tag }}

      - name: Save image tag
        run: |
          echo "${{ steps.image.outputs.tag }}" > image_tag.txt
