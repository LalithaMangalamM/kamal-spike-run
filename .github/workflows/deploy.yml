name: Deploy Rails App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.1'
          bundler-cache: true

      - name: Install Kamal
        run: |
          gem install kamal

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.KAMAL_REGISTRY_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin
      - name: Setup SSH key
        run: |
          mkdir -p .kamal
          echo "${{ secrets.EC2_SSH_KEY }}" > .kamal/github_actions_key
          chmod 600 .kamal/github_actions_key
      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          kamal deploy
