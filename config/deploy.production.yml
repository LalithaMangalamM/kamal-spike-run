service: kamal_spike_run
# Deploy to these servers.
boot:
  limit: 1 # Deploy to 1 server at a time (rolling update)

servers:
  web:
    hosts:
      - 3.110.105.199

  worker:
    hosts:
      - 13.206.209.219
    cmd: bundle exec sidekiq
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: false
  host: kamal-prod-176099216.ap-south-1.elb.amazonaws.com
  healthcheck:
    path: /up            # Default Rails 7.1+ health check route
    interval: 3          # Check every 3 seconds
    timeout: 5           # Wait up to 5 seconds for a response
env:
  clear:
    ENVIRONMENT: production
    SERVER_IP: "%h"
  secret:
    - DATABASE_URL
    - RAILS_MASTER_KEY
    - REDIS_URL
