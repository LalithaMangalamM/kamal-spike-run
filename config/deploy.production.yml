# Application identifier
service: kamal_spike_run

# Container image
image: lalithamangalamm/kamal_spike_run

# Registry authentication
registry:
  username: lalithamangalamm
  password:
    - KAMAL_REGISTRY_PASSWORD

# Rolling update strategy
boot:
  limit: 1

# Production servers
servers:
  web:
    hosts:
      - 3.110.105.199

  worker:
    hosts:
      - 13.206.209.219
    cmd: bundle exec sidekiq

# Proxy configuration
proxy:
  ssl: false
  host: 3.110.105.199
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

# Environment variables
env:
  clear:
    ENVIRONMENT: production
    SERVER_IP: "%h"
  secret:
    - DATABASE_URL
    - RAILS_MASTER_KEY
    - REDIS_URL

# Asset bridging between deployments
asset_path: /rails/public/assets

# Docker image builder
builder:
  arch: amd64

ssh:
  user: ubuntu

# Command aliases
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
